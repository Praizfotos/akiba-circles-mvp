[package]
name = "savings-circle-contract"
version = "0.1.0"
edition = "2021"
description = "Rotating savings circles (esusu/tontine) enforced on-chain — the Akiba Circles core contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.5.0"

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
